name: Security

on:
  push:
  pull_request:

jobs:
  shell-injection-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: No unsafe {{ }} in executeCommand commands
        run: bash scripts/verify_workflow_shell_safe.sh

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install pytest
        run: python -m pip install --no-cache-dir pytest
      - name: Run tests
        run: python -m pytest tests/ -q
