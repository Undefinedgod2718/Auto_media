[project]
name = "auto-media-tools"
version = "0.1.0"
description = "Platform apply and YAML utilities for Auto Media pipeline"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pyyaml>=6.0.2",
]

[project.scripts]
auto-media-apply = "auto_media_tools.apply:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["auto_media_tools"]

[dependency-groups]
dev = []
