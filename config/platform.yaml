version: 1

ui:
  active: n8n
  n8n:
    url: http://localhost:5678
    workflow_id: auto-media-happy-path
  hermes:
    runtime: linux_host
    entry: cli

orchestration:
  primary: n8n
  supervisor: hermes

# Legal engine providers: claude_cli | codex_cli | gemini_cli
# Global copy/svg below are consumed by scripts/lib/invoke-engine.sh.
# engines.platforms.*.writer/artist provider+fallback are NOT read by invoke-engine (skill_mount only).
engines:
  copy:
    provider: claude_cli
    skill_mount: claude_copywriter
    billing: subscription_cli
    binary: claude
    status: active
    fallback:
      - gemini_cli
      - codex_cli
  svg:
    provider: codex_cli
    skill_mount: codex_svg_artist
    billing: subscription_cli
    binary: codex
    status: active
    fallback:
      - gemini_cli
      - claude_cli
  render:
    provider: rsvg
    binary: rsvg-convert
  platforms:
    threads:
      writer:
        provider: claude_cli
        skill_mount: threads_writer
        fallback:
          - gemini_cli
          - codex_cli
      artist:
        provider: codex_cli
        skill_mount: threads_artist
        fallback:
          - gemini_cli
          - claude_cli
    instagram:
      writer:
        provider: claude_cli
        skill_mount: instagram_writer
        fallback:
          - gemini_cli
          - codex_cli
      artist:
        provider: codex_cli
        skill_mount: instagram_artist
        fallback:
          - gemini_cli
          - claude_cli
    facebook:
      writer:
        provider: claude_cli
        skill_mount: facebook_writer
        fallback:
          - gemini_cli
          - codex_cli
      artist:
        provider: codex_cli
        skill_mount: facebook_artist
        fallback:
          - gemini_cli
          - claude_cli

publish:
  mode: auto
  plan_a: meta_graph_api
  plan_b: playwright_dom
  circuit_breaker:
    retries: 3
    signal_file: /data/logs/api_dead.json

features:
  hitl_telegram: true
  hermes_gateway: true
  hermes_cron_supervisor: true
